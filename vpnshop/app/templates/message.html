{% extends "base.html" %}
{% block title %}{{ title }} — {{ cfg.brand_name }}{% endblock %}
{% block content %}
<div class="card narrow stack">
  <h2>{{ title }}</h2>
  <p class="muted">{{ text }}</p>
  {% if link %}<a class="btn" href="{{ link[0] }}">{{ link[1] }}</a>{% endif %}
</div>
{% endblock %}
